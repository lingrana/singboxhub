services:
  panel:
    image: ghcr.io/lingrana/singboxhub:latest
    pull_policy: always
    container_name: sing-box-hub
    restart: unless-stopped
    ports:
      - "42501:42501"
    volumes:
      - ./data:/data
    environment:
      # 首次运行的管理员密码写入 /data/initial-admin-password.txt
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:42501/health"]
      interval: 30s
      timeout: 5s
      retries: 3
